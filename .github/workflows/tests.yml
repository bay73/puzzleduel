name: "Tests"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  checkers:
    name: Checkers tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    # Checkers have no external dependencies, so packages are not installed.
    - name: Run checkers tests
      run: npm test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: npm

    - name: Install packages
      run: npm ci

    - name: Install browser
      run: npx playwright install --with-deps chromium

    # Runs all suites of tests.html (UI tests and checkers tests) in headless browser.
    - name: Run browser tests
      run: npm run test:ui

  server:
    name: Server tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: npm

    # MongoDB for the tests is downloaded by mongodb-memory-server, it is kept between the runs.
    - name: Cache MongoDB binaries
      uses: actions/cache@v4
      with:
        path: ~/.cache/mongodb-binaries
        key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install packages
      run: npm ci

    # Runs the server with temporary databases in memory and sends requests to it.
    - name: Run server tests
      run: npm run test:server
